services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookmark_manager
      POSTGRES_PASSWORD: bookmark_manager
      POSTGRES_DB: bookmark_manager
    ports:
      - "5433:5432"
    volumes:
      - bookmark_manager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bookmark_manager -d bookmark_manager
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bookmark_manager_postgres_data:
